name: Specs Check

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  require-spec-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate specs were updated
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No comparable base SHA was provided. Skipping specs validation."
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No files changed."
            exit 0
          fi

          RELEVANT_PATTERN='^(src/|package\.json$|package-lock\.json$|scripts/notarize\.js$|\.github/workflows/release\.yml$)'

          if ! printf '%s\n' "$CHANGED_FILES" | grep -Eq "$RELEVANT_PATTERN"; then
            echo "No product-impacting files changed. Specs update not required."
            exit 0
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^specs/'; then
            echo "Specs were updated."
            exit 0
          fi

          echo "Code or release behavior changed without updating specs/."
          echo "Please update the relevant file under specs/ before merging."
          exit 1
